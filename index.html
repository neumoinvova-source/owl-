<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OWL</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.app {
    max-width: 1000px;
    margin: 30px auto;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
    overflow: hidden;
}

.header {
    background: #222;
    color: white;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

.content {
    display: flex;
    min-height: 600px;
}

.sidebar {
    width: 220px;
    background: #f7f7f7;
    border-right: 1px solid #ddd;
    padding: 15px;
}

.sidebar h2 {
    margin-top: 0;
}

.button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: white;
    border: 1px solid #bbb;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
}

.button:hover {
    background: #eee;
}

.members {
    margin-top: 25px;
}

.member {
    margin: 12px 0;
    font-size: 16px;
}

.online {
    color: #00a83b;
}

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 18px;
    border-bottom: 1px solid #ddd;
    font-size: 21px;
    font-weight: bold;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    margin-bottom: 16px;
}

.name {
    font-weight: bold;
    margin-bottom: 4px;
}

.text {
    display: inline-block;
    background: #eee;
    padding: 9px 13px;
    border-radius: 8px;
    max-width: 80%;
    word-wrap: break-word;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #ddd;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 16px;
}

.send {
    width: 55px;
    border: none;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send:hover {
    background: #444;
}

@media (max-width: 700px) {

    .app {
        margin: 0;
        border-radius: 0;
    }

    .content {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd;
    }

}

</style>
</head>

<body>

<div class="app">

    <div class="header">
        🦉 OWL
    </div>

    <div class="content">

        <div class="sidebar">

            <h2>Навигация</h2>

            <button class="button">
                💬 Чаты
            </button>

            <button class="button" onclick="alert('Звонки появятся позже')">
                📞 Звонки
            </button>

            <button class="button" onclick="alert('Профиль появится позже')">
                👤 Профиль
            </button>

            <div class="members">

                <h2>Участники</h2>

                <div class="member online">
                    🟢 Вова
                </div>

                <div class="member online">
                    🟢 Макс
                </div>

                <div class="member online">
                    🟢 Дима
                </div>

                <div class="member online">
                    🟢 Саша
                </div>

            </div>

        </div>

        <div class="chat">

            <div class="chat-header">
                💬 Общий чат
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Написать сообщение..."
                    autocomplete="off"
                >

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>

</div>

<script>
    const defaultMessages = [
    {
        name: "OWL",
        text: "Добро пожаловать в OWL!"
    },
    {
        name: "Макс",
        text: "Когда уже играем? 😎"
    },
    {
        name: "Дима",
        text: "Я готов."
    }
];

let messages = JSON.parse(
    localStorage.getItem("owl_messages")
);

if (!messages) {
    messages = defaultMessages;
    saveMessages();
}

function saveMessages() {
    localStorage.setItem(
        "owl_messages",
        JSON.stringify(messages)
    );
}

function showMessages() {

    const container = document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(function(message) {

        const block = document.createElement("div");
        block.className = "message";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = message.name;

        const text = document.createElement("div");
        text.className = "text";
        text.textContent = message.text;

        block.appendChild(name);
        block.appendChild(text);

        container.appendChild(block);

    });

    container.scrollTop = container.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    messages.push({
        name: "Вова",
        text: text
    });

    saveMessages();

    input.value = "";

    showMessages();
}

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

showMessages();

</script>

</body>
</html>
