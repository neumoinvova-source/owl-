<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f1f1;
    color: #222;
}

.app {
    max-width: 1000px;
    height: 90vh;
    margin: 5vh auto;
    display: flex;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
}

/* Левая часть */

.sidebar {
    width: 240px;
    background: #eeeeee;
    padding: 20px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
}

.button {
    width: 100%;
    padding: 12px;
    margin-bottom: 8px;
    border: none;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
}

.button:hover {
    background: #dddddd;
}

.section-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 13px;
    color: #777;
}

.friend {
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
}

.friend:hover {
    background: #dddddd;
}

.online {
    color: green;
}

/* Чат */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 20px;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    margin-bottom: 15px;
}

.message-name {
    font-weight: bold;
    margin-bottom: 3px;
}

.message-text {
    background: #eeeeee;
    display: inline-block;
    padding: 8px 12px;
    border-radius: 10px;
}

.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #ddd;
    gap: 10px;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.send {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

.send:hover {
    background: #444;
}

/* Нижние кнопки */

.bottom-buttons {
    display: flex;
    gap: 8px;
    padding: 10px 15px;
    border-top: 1px solid #ddd;
}

.bottom-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #eeeeee;
    cursor: pointer;
}

/* Телефон */

@media (max-width: 700px) {
    .app {
        margin: 0;
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .sidebar {
        width: 170px;
        padding: 12px;
    }

    .logo {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Сайдбар -->

    <div class="sidebar">

        <div class="logo">🦉 OWL</div>

        <button class="button" onclick="openChat('Общий чат')">
            💬 Чаты
        </button>

        <button class="button" onclick="showCalls()">
            📞 Звонки
        </button>

        <button class="button" onclick="showProfile()">
            👤 Профиль
        </button>

        <div class="section-title">
            ДРУЗЬЯ
        </div>

        <div class="friend" onclick="openChat('Макс')">
            🟢 Макс
        </div>

        <div class="friend" onclick="openChat('Дима')">
            🟢 Дима
        </div>

        <div class="friend" onclick="openChat('Саша')">
            🟢 Саша
        </div>

    </div>


    <!-- Чат -->

    <div class="chat">

        <div class="chat-header" id="chatTitle">
            💬 Общий чат
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Написать сообщение..."
            >

            <button class="send" onclick="sendMessage()">
                Отправить
            </button>

        </div>

        <div class="bottom-buttons">

            <button onclick="showCalls()">
                🎤 Микрофон
            </button>
            <button onclick="showSounds()">
                🔊 Звуки
            </button>

            <button onclick="showStickers()">
                🖼️ Стикеры
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const socket = io("https://owl-server-9w05.onrender.com");

socket.on("receive_message", (message) => {
    messages.push(message);
    saveMessages();
    showMessages();
});
const defaultMessages = [
    {
        name: "OWL",
        text: "Добро пожаловать в OWL! 🦉"
    },
    {
        name: "Макс",
       
    text: "Когда уже играем? 😎"
    },
    {
        name: "Дима",
        text: "Я готов."
    }
];

let messages = JSON.parse(
    localStorage.getItem("owl_messages")
);

if (!messages) {
    messages = defaultMessages;
}

function saveMessages() {
    localStorage.setItem(
        "owl_messages",
        JSON.stringify(messages)
    );
}

function showMessages() {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(function(message) {

        const messageBlock =
            document.createElement("div");

        messageBlock.className = "message";

        const name =
            document.createElement("div");

        name.className = "message-name";

        name.textContent =
            message.name;

        const text =
            document.createElement("div");

        text.className = "message-text";

        text.textContent =
            message.text;

        messageBlock.appendChild(name);
        messageBlock.appendChild(text);

        container.appendChild(messageBlock);

    });

    container.scrollTop =
        container.scrollHeight;
}


function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    socket.emit("send_message", {
        name: "Вова",
        text: text
    });

    input.value = "";
}




document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });


function openChat(name) {

    document.getElementById("chatTitle")
        .textContent = "💬 " + name;

}


function showCalls() {

    alert("📞 Звонки подключим следующим этапом!");

}


function showProfile() {

    alert("👤 Профиль подключим следующим этапом!");

}


function showSounds() {

    alert("🔊 Здесь будет наша звуковая панель!");

}


function showStickers() {

    alert("🖼️ Здесь будут стикеры!");

}


showMessages();

</script>

</body>
</html>
